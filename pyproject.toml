[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapemgen"
version = "0.1.0"
description = "Automated MAPEM file creation prototype for GDP Group 9"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ezdxf>=1.3",
    "fiona>=1.10",
    "pdfplumber>=0.11",
    "pyproj>=3.7",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
geo = ["pyproj", "shapely", "geopandas", "folium"]
cad = ["ezdxf", "shapely"]
pdf = ["pandas", "pdfplumber", "camelot-py"]
cv = ["opencv-python", "pytesseract", "pymupdf"]
train = ["ultralytics>=8", "opencv-python", "pytesseract", "pymupdf"]

[tool.setuptools.packages.find]
where = ["src"]
