# =============================================================================
# Site Configuration — 337L (Rodley Roundabout, Leeds)  ·  精简版
# =============================================================================
# 匹配引擎用的每站点配置,和 matching_rules.yaml 一起喂给引擎。一站点一份。
#
# 本文件分两部分:
#   【A】换站点必填  —— 当前引擎真正读取、每站点要改的(就这几项)
#   【B】预留待接通  —— 接口已设计、当前代码还没读取的字段(暂不用填)
#
# 留空的项 → 自动用 matching_rules.yaml `config:` 段的全局默认值。
# ⚠️ 字段层级不要随意改动——引擎按固定位置读取(见各项注释)。
# =============================================================================


# #############################################################################
# 【A】换站点必填(当前引擎读取,每站点必须确认/填写)
# #############################################################################

# --- A1. 站点身份 + dummy_phases ---
# 注:dummy_phases 必须放在 site: 下(引擎从 site.dummy_phases 读取)。
site:
  id:           "337L"                       # ★改:站点编号
  name:         "Rodley Roundabout"          # ★改:路口名
  source_files:
    pdf:        "337L RODLEY RBOUT SPEC 15_6_15.pdf"   # ★改:PDF文件名
    dwg:        "UTC_716709_AJB_2a.dwg"                # ★改:DWG文件名
  prepared_by:  "TODO: your name"            # ★改:你的名字

  # dummy_phases:PDF "USE OF PHASES" 表里 Type="D"(Dummy)的相位字母。
  # 是控制器占位符、不是真信号组,必须排除否则 signalGroup 映射出错。
  # ⚠️ 换站点必须重查那个站点的 PDF 相位表,绝对不能照抄!
  # 337L:A-T 是真相位,U-A2 是 Dummy。
  dummy_phases: [U, V, W, X, Y, Z, A2]       # ★必改:查该站点PDF相位表

# --- A2. region_code(顶层;进 MAPEM 路口 id.region)---
# C-Roads 规则:2位国家码(英国=50) + 3位机构码。
# 利兹机构码待客户确认;同在利兹的站点可复用同一个值。
# ⚠️ 错了整个路口 ID 就错。
region_code: 50050                           # ★确认:50 + 利兹3位码(现为猜测值)

# --- A3. manual 手动覆盖(顶层;自动提取出错时才填,平时留注释)---
# 每项变成 priority 0 的 fact,盖过所有自动来源。
manual:
  # 路口号:如果 PDF 没提取到 id.id(出现 null),取消下行注释手填:
  # intersection_id: 337

  # 参考点:如果 CAD 算出的 refPoint 不对,取消注释手填正确 WGS84:
  # refpoint:
  #   lat:  53.8007550
  #   long: -1.5490770
  #   note: "Hand-picked from OS basemap"

  # 车道类型:如果某条车道类型判错,按 laneID 单独覆盖(先跑一次拿 laneID):
  # lanetype_overrides:
  #   - laneID: 12
  #     value: crosswalkLane
  #     reason: "Manually verified — Toucan crossing"

# --- A4. priority_overrides(顶层;站点数据质量异常时才用,默认空)---
priority_overrides: []


# #############################################################################
# 【B】预留待接通(接口已设计,当前代码还没读取 —— 换站点暂不用填)
# #############################################################################
# 下面这些当前引擎/解析器尚未读取,填了也不生效,留作未来接通。
# 现在换站点可以整段跳过。等对应环节接上后再逐站点填。
# (注:它们被引擎显式排除在 config 合并之外,留在此处不影响运行。)

# --- station_id:项目级常量(全站点 100),引擎会读但通常不动 ---
station_id: 100

# --- default_lane_width_m:算不出车道宽时的默认(英国标准 3.5m)---
default_lane_width_m: 3.5

# --- crs_source:图纸坐标系。当前坐标转换在 transform 内写死 BNG,
#     此字段暂未被读取。待接通后用于逐站点声明/验证坐标系。---
crs_source: EPSG:27700                       # 预留:确认是否 BNG

# --- conflict_area:冲突区图层提示,辅助 refPoint 提取。当前未接通。---
conflict_area:
  layer_name_hint: "CONFLICT_ZONE"           # 预留
  type: "polygon"

# --- parser_hints:给抽取环节的提示。当前抽取代码自动扫描,未读取本配置。---
parser_hints:
  pdf:
    # 抽取器自动遍历所有页,这些页码当前无用,无需填。
    use_of_phases_page: null                 # 预留(自动扫页,通常不需要)
    stage_table_page: null
    detector_table_page: null
  cad:
    # ⚠️ 重点预留:车道线图层名。当前抽取没按图层过滤(车道识别失败的根因
    # 之一)。等抽取环节接通"按图层识别车道线"后,这里逐站点填图层名。
    lane_centerline_layer: ""                # 预留(接通后填,如 "A1-WHITE-LINES")
    stop_line_layer: ""                      # 预留
    signal_head_block: ["STANDARD POLE", "BOXSIGN1"]   # 预留
  gis:
    # OSM 限定范围。当前未接通;接通后逐站点填该路口经纬度边界(±200m)。
    osm_bbox_wgs84:                          # 预留
      min_lat: null
      max_lat: null
      min_long: null
      max_long: null

# --- expected:输出合理性校验(车道数/信号组数范围)。
#     当前是否消费视引擎而定;填了可帮助发现异常(如车道数爆炸)。---
expected:                                    # 预留(可选,有质检价值)
  num_intersections: 1
  num_lanes_min: null
  num_lanes_max: null
  num_signal_groups_min: null
  num_signal_groups_max: null


# =============================================================================
# 换站点速记:只需处理【A】部分
#   A1 site:站点身份 + ★dummy_phases(必查该站点PDF相位表)
#   A2 region_code(同利兹可照抄)
#   A3 manual(仅在自动出错时才填,如 PDF 没抽到路口号)
#   A4 priority_overrides(默认空)
# 【B】部分换站点一律跳过,待接通后再填。
# =============================================================================
