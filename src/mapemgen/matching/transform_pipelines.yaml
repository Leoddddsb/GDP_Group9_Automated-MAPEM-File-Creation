# ============================================================
# transform_pipelines.yaml
# ============================================================
# Maintained SEPARATELY from matching_rules.yaml (which is generated from the
# xlsx and carries no transforms). This file maps a source — by target field
# glob + fact_name glob — to an ordered chain of transform names. The names
# must exist in transforms.py's TRANSFORMS registry.
#
# The engine looks up each chosen source's chain here at run time
# (first match wins; '*' globs allowed).
#
# Contract note: the engine passes the chosen fact's `payload` as the initial
# value into the first transform. So the FIRST transform must accept whatever
# shape the parser puts in payload (e.g. a point list for geometry, a label
# string for phases). Where payload is a wrapper dict, add a leading extractor.
#
# Context kwargs available to any transform that declares them (signature-aware):
#   ref_point        — resolved {lat,lon} of the intersection refPoint
#   dummy_phase_set  — site_config.dummy_phases (phases to drop, e.g. U V W ...)
#   phase_order      — optional explicit phase ordering
#   output           — laneType output flavour ('sitemodel' | 'mapem')
# ============================================================

version: "1.0"

pipelines:

  # ---- identity -----------------------------------------------------------
  - target: "*.id.id"
    fact_name: official_intersection_id_from_cad
    transform: [extract_int_from_site_code]

  # ---- reference point (geometry → centroid → BNG→WGS84 → int 1e7) --------
  # NOTE: bng_to_wgs84_OSTN15 only delivers true OSTN15 accuracy if the OSTN15
  # grid is installed (see conflict_rules.md / README). Without it pyproj falls
  # back to a ~metre-level Helmert transform.
  - target: "*.refPoint.lat"
    fact_name: lane_geometry_candidate_from_cad
    transform: [junction_centre_lat]
  - target: "*.refPoint.long"
    fact_name: lane_geometry_candidate_from_cad
    transform: [junction_centre_long]
  - target: "*.refPoint.lat"
    fact_name: stop_line_from_cad
    transform: [polygon_centroid, bng_to_wgs84_OSTN15, take_lat, wgs84_to_int_1e7]
  - target: "*.refPoint.long"
    fact_name: stop_line_from_cad
    transform: [polygon_centroid, bng_to_wgs84_OSTN15, take_long, wgs84_to_int_1e7]
  - target: "*.refPoint.lat"
    fact_name: approach_arm_geometry_from_cad
    transform: [polygon_centroid, bng_to_wgs84_OSTN15, take_lat, wgs84_to_int_1e7]
  - target: "*.refPoint.long"
    fact_name: approach_arm_geometry_from_cad
    transform: [polygon_centroid, bng_to_wgs84_OSTN15, take_long, wgs84_to_int_1e7]

  # ---- lane node offsets (point → offset from refPoint → cm) --------------
  - target: "*.nodeList.nodes[].delta"
    fact_name: "*"
    transform: [as_point, relative_to_refpoint, delta_to_cm]

  # ---- signal group (phase label → signal group int; drops dummy phases) --
  - target: "*.signalGroup"
    fact_name: phase_label_from_controller_config
    transform: [phase_letter_to_signal_group]
  - target: "*.signalGroup"
    fact_name: phase_label_from_utc_form
    transform: [phase_letter_to_signal_group]
  - target: "*.signalGroup"
    fact_name: lane_connection_candidate_from_cad
    transform: [explicit_signal_group_id]

  # ---- lane attribute classification --------------------------------------
  - target: "*.laneAttributes.laneType"
    fact_name: "*"
    transform: [lane_type_from_label]
  - target: "*.laneAttributes.directionalUse"
    fact_name: "*"
    transform: [directional_use_from_label, encode_bit_string_2]
  - target: "*.laneAttributes.sharedWith"
    fact_name: "*"
    transform: [shared_with_from_label]

  # ---- approaches (cross-lane: engine prepass clusters lanes; these read it) --
  # The engine's lane prepass assigns approach IDs and ingress/egress direction
  # per lane. These transforms just read the precomputed result for this lane.
  - target: "*.ingressApproach"
    fact_name: "*"
    transform: [ingress_approach_id]
  - target: "*.egressApproach"
    fact_name: "*"
    transform: [egress_approach_id]

  # ---- connecting lane (resolved via geometry pairing in the engine prepass) --
  - target: "*.connectingLane.lane"
    fact_name: lane_connection_candidate_from_cad
    transform: [connecting_lane_id]
  - target: "*.connectingLane.lane"
    fact_name: "*"
    transform: [resolve_egress_lane_from_stage]
