# =============================================================================
# Site Configuration — 337L (Rodley Roundabout, Leeds)
# =============================================================================
# Per-site configuration consumed by the matching engine alongside
# matching_rules.yaml. One file per site.
#
# What this file controls:
#   1. Project-level constants (station_id, region_code, ...)
#   2. Site-specific domain knowledge (dummy_phases, ...)
#   3. Optional manual overrides (when auto-extraction fails)
#   4. Optional priority overrides (when this site's data quality differs)
#
# Anything left out → falls back to defaults in matching_rules.yaml's
# `config:` section.
# =============================================================================

# -----------------------------------------------------------------------------
# 0. Site metadata (informational, not used by engine logic)
# -----------------------------------------------------------------------------
site:
  id:           "337L"
  name:         "Rodley Roundabout"
  authority:    "Leeds City Council"
  description:  "Fully signalised roundabout, A6120 / Rodley Lane"
  source_files:
    pdf:        "337L RODLEY RBOUT SPEC 15_6_15.pdf"
    dwg:        "UTC_716709_AJB_2a.dwg"
    pdf_issue:  "ONE (15/06/15)"      # from PDF cover; NOT msgIssueRevision
  prepared_by:  "TODO: your name"
  prepared_on:  "2026-06-02"


# =============================================================================
# 1. REQUIRED project-level config
# =============================================================================
# These OVERRIDE the global defaults in matching_rules.yaml `config:` section.
# Anything you leave out here uses the global default.

# Sender ITS-S identifier (any project-chosen integer 0..2^32-1).
# Default 100 in global config; can keep the same for all Leeds sites.
station_id: 100

# Road regulator ID — C-Roads scheme: 2-digit country + 3-digit authority.
# UK = 50.  Leeds authority code = TBD (client confirmation pending).
# Provisional value below; change once client confirms.
region_code: 50050              # TBD: 50 + 3-digit Leeds code (50050 = guess)

# Default lane width when not derivable from CAD geometry.
# 3.5 m is the UK standard urban lane; override only if this site differs.
default_lane_width_m: 3.5

# Coordinate system of the DWG/DXF for this site.
# Almost all Leeds sites are BNG (EPSG:27700). VERIFY per site — some legacy
# drawings may be in local construction coords (not BNG).
crs_source: EPSG:27700           # TBD: confirm by checking known points


# =============================================================================
# 2. REQUIRED site-specific domain knowledge
# =============================================================================
# These are things a human MUST fill — they can't be auto-extracted reliably.

# --- Dummy phases ---
# Letters in PDF USE OF PHASES with Type = "D" (Dummy). These are controller
# placeholders, NOT real signal groups. They MUST be excluded from MAPEM
# signalGroup mapping (otherwise SPATEM matching breaks).
#
# For 337L: phases A-T are real; U-A2 are Type=D.
dummy_phases: [U, V, W, X, Y, Z, A2]

# --- Conflict-area boundary hint (optional but recommended) ---
# Used by the cad_parser to identify which CAD layer/polygon represents the
# conflict zone (the central roundabout area, in 337L's case). Helps the
# refPoint extraction find the right polygon when several candidates exist.
conflict_area:
  layer_name_hint:   "CONFLICT_ZONE"    # TBD: confirm from DXF inspection
  type:              "polygon"          # roundabout has a circular polygon


# =============================================================================
# 3. OPTIONAL manual overrides
# =============================================================================
# Fill ONLY if auto-extraction produces wrong values.
# Each manual.* entry becomes a fact with priority 0 (highest), beating all
# auto sources for that field.

manual:
  # --- refPoint override ---
  # If CAD-derived refPoint is wrong (e.g. CAD has rubbish geometry on the
  # conflict_area layer), specify the correct WGS84 point here.
  # refpoint:
  #   lat:  53.8007550
  #   long: -1.5490770
  #   note: "Hand-picked from OS basemap; centre of roundabout."

  # --- intersection_id override ---
  # If PDF site_id extraction fails (e.g. PDF has irregular cover), override:
  # intersection_id: 337

  # --- per-lane laneType override ---
  # If automatic phase_type → laneType mapping doesn't fit a specific lane,
  # override the type for that specific laneID. Indexed by automatically
  # assigned laneID after the first matching run.
  # lanetype_overrides:
  #   - laneID: 12
  #     value: crosswalkLane
  #     reason: "Manually verified — straddles a Toucan crossing"


# =============================================================================
# 4. OPTIONAL priority overrides
# =============================================================================
# Adjust priority for specific (target, fact_type) pairs when this site's
# data quality differs from the global assumption.
# Leave empty for most sites — only use when the global defaults misbehave
# for this particular site.

priority_overrides: []
  # Example: this site's OSM data is more accurate than its CAD geometry,
  # bump OSM to highest fact-source priority for refPoint.
  # priority_overrides:
  #   - target: intersections[].refPoint.lat
  #     fact_type: gis.osm.intersection_node
  #     priority: 1
  #   - target: intersections[].refPoint.lat
  #     fact_type: cad.conflict_area_polygon
  #     priority: 3


# =============================================================================
# 5. OPTIONAL parser hints
# =============================================================================
# Hints passed down to Week 2 parsers when generic layer/keyword matching
# isn't sufficient.

parser_hints:
  pdf:
    site_id_page: 1                  # PDF cover page
    use_of_phases_page: 10           # known location in 337L spec
    stage_table_page: 13
    detector_table_page: 29
  cad:
    # Hint about which DWG layers carry which content (when layer naming
    # is non-standard). Leave blank to let parser auto-detect.
    lane_centerline_layer: ""        # TBD
    stop_line_layer: ""              # TBD
    signal_head_block: ["STANDARD POLE", "BOXSIGN1"]
  gis:
    # Bounding box hint for filtering OSM data to this intersection's area.
    # Roughly centred on the site, ±200 m.
    osm_bbox_wgs84:
      min_lat: 53.799
      max_lat: 53.802
      min_long: -1.551
      max_long: -1.547


# =============================================================================
# 6. Validation / sanity-check expectations
# =============================================================================
# Optional. If filled, the matching engine cross-checks its output against
# these expectations and flags any drift in validation_report.json.

expected:
  num_intersections: 1
  num_lanes_min: 8                  # rough lower bound
  num_lanes_max: 40                 # rough upper bound for a roundabout
  num_signal_groups_min: 15         # 337L: A..T excluding dummies ~ 17-20
  num_signal_groups_max: 22


# =============================================================================
# END
# =============================================================================
