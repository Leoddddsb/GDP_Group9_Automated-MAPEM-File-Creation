# ============================================================
# matching_rules.yaml — GENERATED from MAPEM_Dictionary.xlsx
# Do NOT hand-edit the 'fields' section. Edit the xlsx and run
#   python build_rules_from_dict.py MAPEM_Dictionary.xlsx matching_rules.yaml
# Hand-authored overlay (constants, c_roads_mandatory, forbidden,
# config) lives in build_rules_from_dict.py.
# ============================================================

version: '2.0'
schema_for: MAPEM 3.2.0 (C-Roads profile)
source_of_truth: MAPEM_Dictionary.xlsx (Fact + Source Priority sheets)
generated_by: build_rules_from_dict.py — DO NOT hand-edit fields; edit the xlsx and regenerate
priority_ranks:
  P1: 1
  P2: 2
  P3: 3
  F: 9
group_logic:
  policy: all_required
  description: Each fact_group is required (AND). Groups inside an alternative set are OR — satisfying
    any one satisfies that logical slot. Within a group, sources are OR (priority pick).
  alternative_sets:
    geometry:
    - lane_geometry
    - road_layout_geometry
population_modes:
  constant: Fixed by the MAPEM profile; no extraction.
  client_configured: Provided/confirmed by client or deployment config.
  project_managed: Maintained by the MAPEM lifecycle/versioning process.
  directly_extracted: Read directly from official source content.
  geometry_derived: Computed/inferred from spatial/geometry evidence.
  system_generated: Assigned by the prototype after objects are extracted.
  evidence_fused: Requires combined evidence from multiple source types.
config:
  protocol_version: 2
  message_id_mapem: 5
  default_station_id: 100
  region_code: 50050
  default_lane_width_m: 3.5
  crs_source: EPSG:27700
  crs_target: EPSG:4326
  bng_to_wgs84: OSTN15
conflict_detection:
  tolerances:
    coordinate:
      method: ground_distance_m
      tolerance: 2.0
      note: lat/long; compared as ground distance in metres
    node_delta:
      method: ground_distance_m
      tolerance: 1.0
      note: lane geometry nodes; tighter than refPoint
    integer_id:
      method: exact
      tolerance: 0
      note: signalGroup/LaneID/region/id; must match exactly
    enum:
      method: exact
      note: laneType/directionalUse; no notion of 'close'
    angle:
      method: angular_deg
      tolerance: 15.0
      note: approach/maneuver bearings; degrees
    default:
      method: exact
      note: 'fallback: require exact equality'
  field_type_map:
    '*.refPoint.lat': coordinate
    '*.refPoint.long': coordinate
    '*.nodeList.nodes[].delta': node_delta
    '*.signalGroup': integer_id
    '*.LaneID': integer_id
    '*.id.region': integer_id
    '*.id.id': integer_id
    '*.laneType': enum
    '*.directionalUse': enum
    '*.sharedWith': enum
    '*.ingressApproach': angle
    '*.egressApproach': angle
