mandatory_mapem_paths:
  - header.protocolVersion
  - header.messageID
  - header.stationID
  - MapData.msgIssueRevision
  - MapData.intersections[].id.region
  - MapData.intersections[].id.id
  - MapData.intersections[].revision
  - MapData.intersections[].refPoint.lat
  - MapData.intersections[].refPoint.long
  - MapData.intersections[].laneSet[]
  - MapData.intersections[].laneSet[].laneID
  - MapData.intersections[].laneSet[].ingressApproach
  - MapData.intersections[].laneSet[].egressApproach
  - MapData.intersections[].laneSet[].laneAttributes.directionalUse
  - MapData.intersections[].laneSet[].laneAttributes.sharedWith
  - MapData.intersections[].laneSet[].laneAttributes.laneType
  - MapData.intersections[].laneSet[].nodeList.nodes[].delta
  - MapData.intersections[].laneSet[].connectsTo[].connectingLane.lane
  - MapData.intersections[].laneSet[].connectsTo[].signalGroup

source_categories:
  system_constant:
    confirmed_in_current_dataset: true
    active_mvp_dependency: true
    provides:
      - protocol_version
      - message_id

  system_allocation:
    confirmed_in_current_dataset: true
    active_mvp_dependency: true
    provides:
      - stable_lane_id
      - generated_internal_identifiers

  derived_from_geometry_processing:
    confirmed_in_current_dataset: true
    active_mvp_dependency: true
    provides:
      - classified_lane_direction
      - approach_assignment
      - node_deltas_relative_to_refpoint

  project_or_client_configuration:
    confirmed_in_current_dataset: required
    active_mvp_dependency: true
    possible_subtypes:
      - client_deployment_configuration
      - mapem_lifecycle_record
      - authority_identifier_mapping
      - topology_change_record
    provides:
      - station_id
      - road_regulator_id
      - mapem_message_revision
      - topology_revision

  site_plans_and_cad_files:
    confirmed_in_current_dataset: true
    active_mvp_dependency: true
    confirmed_subtypes:
      - cad_drawing
      - annotated_drawing_pdf
      - embedded_layout_in_specification_pdf
    provides:
      - vector_geometry
      - title_block_site_identity
      - junction_centre_candidate
      - coordinate_reference_system_evidence
      - lane_candidate
      - lane_centreline_nodes
      - stop_line_candidate
      - road_arm_candidate
      - lane_connection_candidate
      - lane_marking_evidence
      - movement_annotation

  site_configuration_information:
    confirmed_in_current_dataset: true
    active_mvp_dependency: true
    confirmed_subtypes:
      - signal_specification_pdf
      - controller_configuration_pdf
      - utc_form_docx
      - mova_schematic_docx
      - ram_8tx
      - mova_proprietary_file
    provides:
      - official_intersection_id
      - scn
      - orn
      - site_identity_evidence
      - phase_label
      - stage_phase_relationship
      - movement_phase_mapping
      - pedestrian_phase_candidate
      - configuration_notes

  gis_data:
    confirmed_in_current_dataset: false
    active_mvp_dependency: false
    possible_subtypes:
      - ordnance_survey
      - authoritative_gis
      - open_street_map
    provides:
      - geographic_cross_check
      - fallback_reference_point_evidence

  asset_management_tools:
    confirmed_in_current_dataset: false
    active_mvp_dependency: false
    possible_subtypes:
      - pole_asset_export
      - signal_head_asset_export
    provides:
      - equipment_location_evidence

  road_condition_and_lidar_surveys:
    confirmed_in_current_dataset: false
    active_mvp_dependency: false
    possible_subtypes:
      - lidar
      - topographic_survey
    provides:
      - high_resolution_lane_geometry
      - geometry_validation_evidence

  package_metadata:
    confirmed_in_current_dataset: true
    active_mvp_dependency: false
    possible_subtypes:
      - filename
      - package_folder_name
      - cad_manifest_txt
    provides:
      - weak_site_identity_hint
      - external_reference_identification

elements:
  header.protocolVersion:
    mandatory_in_mvp: true
    population_mode: constant
    required_fact_types: []
    source_priority:
      - priority: P1
        source_category: system_constant
        preferred_subtypes:
          - mapem_profile_constant
        condition: required_mapem_profile_selected
    source_conditions:
      - profile_version_must_be_selected_before_generation
    review_triggers:
      - protocol_version_constant_missing
      - protocol_version_constant_conflicts_with_profile
    validation_rules:
      - protocol_version_must_match_required_constant

  header.messageID:
    mandatory_in_mvp: true
    population_mode: constant
    required_fact_types: []
    source_priority:
      - priority: P1
        source_category: system_constant
        preferred_subtypes:
          - mapem_message_type_constant
        condition: message_type_is_mapem
    source_conditions:
      - message_type_must_be_selected_before_generation
    review_triggers:
      - message_id_constant_missing
      - message_id_does_not_identify_mapem
    validation_rules:
      - message_id_must_identify_mapem

  header.stationID:
    mandatory_in_mvp: true
    population_mode: client_configured
    required_fact_types:
      - station_id
    source_priority:
      - priority: P1
        source_category: project_or_client_configuration
        preferred_subtypes:
          - client_deployment_configuration
        condition: station_id_explicitly_configured
      - priority: P2
        source_category: site_configuration_information
        preferred_subtypes:
          - utc_form_docx
          - controller_configuration_pdf
          - signal_specification_pdf
        condition: only_if_station_id_is_explicit
      - priority: P3
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - annotated_drawing_pdf
          - cad_drawing
        condition: title_block_or_metadata_contains_explicit_station_id
    source_conditions:
      - do_not_infer_station_id_from_filename_only
      - official_source_must_explicitly_label_station_id
    review_triggers:
      - missing_station_id
      - conflicting_station_ids
      - station_id_only_available_from_filename
    validation_rules:
      - station_id_must_be_populated
      - station_id_must_be_confirmed_by_explicit_source_or_review

  MapData.msgIssueRevision:
    mandatory_in_mvp: true
    population_mode: project_managed
    required_fact_types:
      - mapem_message_revision
    source_priority:
      - priority: P1
        source_category: project_or_client_configuration
        preferred_subtypes:
          - mapem_lifecycle_record
        condition: lifecycle_record_available
    source_conditions:
      - revision_is_managed_by_mapem_lifecycle_not_copied_from_document_issue
    review_triggers:
      - msg_issue_revision_not_initialised
      - document_issue_number_used_as_msg_issue_revision
    validation_rules:
      - msg_issue_revision_must_be_present
      - msg_issue_revision_must_not_be_copied_from_ordinary_document_issue

  MapData.intersections[].id.region:
    mandatory_in_mvp: true
    population_mode: client_configured
    required_fact_types:
      - road_regulator_id
    source_priority:
      - priority: P1
        source_category: project_or_client_configuration
        preferred_subtypes:
          - authority_identifier_mapping
          - client_deployment_configuration
        condition: road_regulator_id_explicitly_configured
      - priority: P2
        source_category: site_configuration_information
        preferred_subtypes:
          - utc_form_docx
          - signal_specification_pdf
          - controller_configuration_pdf
        condition: only_if_road_regulator_id_is_explicit
      - priority: P3
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - annotated_drawing_pdf
          - cad_drawing
        condition: title_block_contains_explicit_road_regulator_identifier
    source_conditions:
      - region_must_represent_the_road_regulator_identifier
      - local_authority_name_alone_requires_identifier_mapping
    review_triggers:
      - missing_road_regulator_id
      - authority_identifier_unconfirmed
      - conflicting_road_regulator_ids
    validation_rules:
      - region_must_be_populated
      - region_must_be_valid_for_deployment_domain

  MapData.intersections[].id.id:
    mandatory_in_mvp: true
    population_mode: directly_extracted
    required_fact_types:
      - official_intersection_id
      - scn
      - orn
    source_priority:
      - priority: P1
        source_category: site_configuration_information
        preferred_subtypes:
          - utc_form_docx
          - controller_configuration_pdf
          - signal_specification_pdf
        use_for: official_site_identity
      - priority: P2
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - annotated_drawing_pdf
          - cad_drawing
        use_for: title_block_confirmation
      - priority: P3
        source_category: package_metadata
        preferred_subtypes:
          - filename
          - package_folder_name
        condition: fallback_only_with_review
    source_conditions:
      - prefer_explicit_official_identifier_over_inferred_filename_identifier
      - drawing_title_block_can_confirm_but_should_not_override_official_configuration
    review_triggers:
      - missing_official_intersection_id
      - conflicting_official_intersection_ids
      - only_filename_identifier_available
    validation_rules:
      - intersection_id_must_be_present
      - intersection_id_must_identify_one_intersection
      - intersection_id_must_be_unique_within_road_regulator_domain

  MapData.intersections[].revision:
    mandatory_in_mvp: true
    population_mode: project_managed
    required_fact_types:
      - topology_revision
    source_priority:
      - priority: P1
        source_category: project_or_client_configuration
        preferred_subtypes:
          - mapem_lifecycle_record
          - topology_change_record
        condition: topology_revision_managed_by_project
      - priority: P2
        source_category: project_or_client_configuration
        preferred_subtypes:
          - client_deployment_configuration
        condition: explicit_client_confirmation_available
    source_conditions:
      - revision_changes_only_when_map_topology_changes
      - ordinary_document_issue_numbers_are_not_topology_revisions
    review_triggers:
      - topology_revision_not_initialised
      - document_issue_mistaken_as_topology_revision
      - topology_change_without_revision_update
    validation_rules:
      - topology_revision_must_be_present
      - topology_revision_must_match_mapem_lifecycle_record
      - topology_revision_must_align_with_spatem_revision_when_paired

  MapData.intersections[].refPoint.lat:
    mandatory_in_mvp: true
    population_mode: geometry_derived
    required_fact_types:
      - junction_centre_candidate
      - coordinate_reference_system_evidence
      - georeference_status
      - reference_point_latitude
    source_priority:
      - priority: P1
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - cad_drawing
        condition: cad_is_georeferenced_or_crs_is_reliably_known
      - priority: P2
        source_category: gis_data
        preferred_subtypes:
          - ordnance_survey
          - authoritative_gis
        condition: if_available
      - priority: P3
        source_category: gis_data
        preferred_subtypes:
          - open_street_map
        condition: approximate_fallback_or_cross_check
    source_conditions:
      - coordinate_reference_system_must_be_known
      - reference_point_should_represent_junction_conflict_area_centre
      - pdf_or_image_layout_alone_cannot_produce_reliable_latitude_without_alignment
    review_triggers:
      - cad_coordinate_system_unknown
      - candidate_reference_points_conflict
      - reference_point_outside_expected_junction_area
      - only_review_alignment_available
    validation_rules:
      - latitude_must_be_present
      - latitude_must_be_in_valid_range
      - reference_point_should_be_near_conflict_area_centre

  MapData.intersections[].refPoint.long:
    mandatory_in_mvp: true
    population_mode: geometry_derived
    required_fact_types:
      - junction_centre_candidate
      - coordinate_reference_system_evidence
      - georeference_status
      - reference_point_longitude
    source_priority:
      - priority: P1
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - cad_drawing
        condition: cad_is_georeferenced_or_crs_is_reliably_known
      - priority: P2
        source_category: gis_data
        preferred_subtypes:
          - ordnance_survey
          - authoritative_gis
        condition: if_available
      - priority: P3
        source_category: gis_data
        preferred_subtypes:
          - open_street_map
        condition: approximate_fallback_or_cross_check
    source_conditions:
      - coordinate_reference_system_must_be_known
      - reference_point_should_represent_junction_conflict_area_centre
      - pdf_or_image_layout_alone_cannot_produce_reliable_longitude_without_alignment
    review_triggers:
      - cad_coordinate_system_unknown
      - candidate_reference_points_conflict
      - reference_point_outside_expected_junction_area
      - only_review_alignment_available
    validation_rules:
      - longitude_must_be_present
      - longitude_must_be_in_valid_range
      - reference_point_should_be_near_conflict_area_centre

  MapData.intersections[].laneSet[]:
    mandatory_in_mvp: true
    population_mode: geometry_derived
    required_fact_types:
      - controlled_lane_candidate
      - crosswalk_lane_candidate
      - lane_grouping_candidate
    source_priority:
      - priority: P1
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - cad_drawing
        condition: vector_lane_geometry_available
      - priority: P2
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - annotated_drawing_pdf
          - embedded_layout_in_specification_pdf
        condition: supports_lane_presence_and_lane_role
    source_conditions:
      - lane_set_should_include_all_signal_controlled_lanes
      - lane_candidates_must_be_classified_before_lane_id_allocation
    review_triggers:
      - controlled_lane_not_geometrically_resolved
      - lane_set_incomplete_or_ambiguous
      - crosswalk_lane_candidate_uncertain
    validation_rules:
      - all_signal_controlled_lanes_must_be_included
      - each_lane_in_lane_set_must_receive_a_unique_lane_id

  MapData.intersections[].laneSet[].laneID:
    mandatory_in_mvp: true
    population_mode: system_generated
    required_fact_types:
      - lane_candidate
    source_priority:
      - priority: P1
        source_category: system_allocation
        preferred_subtypes:
          - stable_lane_id_allocator
        condition: lane_candidates_have_been_extracted_and_ordered
    source_conditions:
      - lane_id_should_be_generated_after_lane_extraction
      - lane_id_should_not_be_read_from_cad_unless_explicitly_defined_as_mapem_lane_id
    review_triggers:
      - duplicate_lane_ids
      - unstable_lane_id_ordering
      - lane_candidate_missing_required_identity
    validation_rules:
      - lane_id_must_be_unique_within_intersection
      - lane_id_must_reference_one_generic_lane

  MapData.intersections[].laneSet[].ingressApproach:
    mandatory_in_mvp: true
    population_mode: geometry_derived
    required_fact_types:
      - lane_direction_candidate
      - stop_line_candidate
      - road_arm_candidate
    source_priority:
      - priority: P1
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - cad_drawing
        condition: lane_direction_and_stop_line_geometry_available
      - priority: P2
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - annotated_drawing_pdf
          - embedded_layout_in_specification_pdf
        condition: supports_approach_direction_interpretation
      - priority: P3
        source_category: site_configuration_information
        preferred_subtypes:
          - mova_schematic_docx
          - signal_specification_pdf
        condition: fallback_semantic_support_only
    source_conditions:
      - ingress_approach_applies_to_lanes_entering_the_intersection
      - approach_assignment_must_be_consistent_with_lane_centreline_direction
    review_triggers:
      - ingress_direction_uncertain
      - stop_line_not_identified
      - road_arm_assignment_conflict
    validation_rules:
      - ingress_approach_must_be_consistent_with_lane_direction
      - ingress_approach_must_not_conflict_with_egress_approach

  MapData.intersections[].laneSet[].egressApproach:
    mandatory_in_mvp: true
    population_mode: geometry_derived
    required_fact_types:
      - lane_direction_candidate
      - exit_lane_candidate
      - road_arm_candidate
    source_priority:
      - priority: P1
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - cad_drawing
        condition: lane_direction_and_exit_geometry_available
      - priority: P2
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - annotated_drawing_pdf
          - embedded_layout_in_specification_pdf
        condition: supports_exit_direction_interpretation
      - priority: P3
        source_category: site_configuration_information
        preferred_subtypes:
          - mova_schematic_docx
          - signal_specification_pdf
        condition: fallback_semantic_support_only
    source_conditions:
      - egress_approach_applies_to_lanes_leaving_the_intersection
      - approach_assignment_must_be_consistent_with_lane_centreline_direction
    review_triggers:
      - egress_direction_uncertain
      - exit_lane_not_identified
      - road_arm_assignment_conflict
    validation_rules:
      - egress_approach_must_be_consistent_with_lane_direction
      - egress_approach_must_not_conflict_with_ingress_approach

  MapData.intersections[].laneSet[].laneAttributes.directionalUse:
    mandatory_in_mvp: true
    population_mode: geometry_derived
    required_fact_types:
      - classified_lane_direction
      - approach_assignment
    source_priority:
      - priority: P1
        source_category: derived_from_geometry_processing
        preferred_subtypes:
          - approach_assignment
        condition: ingress_or_egress_role_resolved
      - priority: P2
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - cad_drawing
          - annotated_drawing_pdf
        condition: drawing_confirms_lane_direction
    source_conditions:
      - directional_use_should_be_derived_from_resolved_lane_direction
      - do_not_populate_by_unchecked_text_search
    review_triggers:
      - approach_unresolved
      - directional_use_sources_conflict
      - lane_direction_confidence_too_low
    validation_rules:
      - correct_directional_use_bits_must_be_set
      - directional_use_must_match_ingress_or_egress_approach

  MapData.intersections[].laneSet[].laneAttributes.sharedWith:
    mandatory_in_mvp: true
    population_mode: evidence_fused
    required_fact_types:
      - shared_use_candidate
      - lane_marking_evidence
      - pedestrian_or_cycle_use_candidate
    source_priority:
      - priority: P1
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - cad_drawing
          - annotated_drawing_pdf
        condition: markings_or_lane_symbols_identify_shared_use
      - priority: P2
        source_category: site_configuration_information
        preferred_subtypes:
          - signal_specification_pdf
          - utc_form_docx
          - controller_configuration_pdf
        condition: configuration_notes_support_shared_use
    source_conditions:
      - shared_use_should_be_confirmed_by_geometry_markings_or_explicit_configuration_notes
      - absence_of_marking_should_not_automatically_mean_no_shared_use_if_drawing_quality_is_low
    review_triggers:
      - shared_use_unclear
      - shared_with_sources_conflict
      - drawing_markings_not_legible
    validation_rules:
      - shared_with_mandatory_value_must_be_populated
      - shared_with_value_must_be_consistent_with_lane_type

  MapData.intersections[].laneSet[].laneAttributes.laneType:
    mandatory_in_mvp: true
    population_mode: evidence_fused
    required_fact_types:
      - lane_type_candidate
      - crossing_candidate
      - phase_type
      - pedestrian_phase_candidate
    source_priority:
      - priority: P1
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - cad_drawing
          - annotated_drawing_pdf
        condition: lane_geometry_and_markings_identify_lane_type
      - priority: P2
        source_category: site_configuration_information
        preferred_subtypes:
          - signal_specification_pdf
          - controller_configuration_pdf
          - utc_form_docx
        condition: control_data_supports_pedestrian_cycle_or_vehicle_type
    source_conditions:
      - geometry_or_drawing_classification_should_agree_with_control_evidence
      - pedestrian_and_cycle_facilities_require_explicit_or_geometric_support
    review_triggers:
      - lane_type_sources_conflict
      - lane_type_unclassified
      - crossing_candidate_without_matching_control_evidence
    validation_rules:
      - mandatory_lane_type_must_be_selected
      - lane_type_must_be_consistent_with_directional_use_and_shared_with

  MapData.intersections[].laneSet[].nodeList.nodes[].delta:
    mandatory_in_mvp: true
    population_mode: geometry_derived
    required_fact_types:
      - lane_centreline_nodes
      - reference_point
      - coordinate_reference_system_evidence
    source_priority:
      - priority: P1
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - cad_drawing
        condition: vector_lane_geometry_available
      - priority: P2
        source_category: road_condition_and_lidar_surveys
        preferred_subtypes:
          - lidar
          - topographic_survey
        condition: if_available_for_geometry_validation_or_refinement
      - priority: P3
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - annotated_drawing_pdf
          - embedded_layout_in_specification_pdf
        condition: fallback_digitisation_only
    source_conditions:
      - lane_centreline_geometry_must_be_extractable
      - nodes_must_be_encoded_relative_to_refpoint
      - coordinate_reference_system_must_be_known_or_reviewed
    review_triggers:
      - lane_centreline_broken
      - geometry_not_georeferenced
      - node_sequence_direction_uncertain
      - digitised_drawing_used_as_only_geometry_source
    validation_rules:
      - nodes_must_follow_lane_centreline
      - nodes_must_be_encoded_relative_to_refpoint
      - node_sequence_must_match_lane_direction

  MapData.intersections[].laneSet[].connectsTo[].connectingLane.lane:
    mandatory_in_mvp: true
    population_mode: evidence_fused
    required_fact_types:
      - lane_connection_candidate
      - movement_direction_candidate
      - target_lane_candidate
    source_priority:
      - priority: P1
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - cad_drawing
        condition: lane_topology_and_target_lane_are_extractable
      - priority: P2
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - annotated_drawing_pdf
          - embedded_layout_in_specification_pdf
        condition: movement_arrows_or_annotations_confirm_connection
      - priority: P3
        source_category: site_configuration_information
        preferred_subtypes:
          - mova_schematic_docx
          - signal_specification_pdf
        condition: schematic_supports_movement_interpretation_only
    source_conditions:
      - connecting_lane_lanes_must_reference_existing_lane_ids
      - geometry_should_identify_a_unique_target_lane
    review_triggers:
      - multiple_target_lanes_plausible
      - no_target_lane_resolved
      - movement_direction_sources_conflict
    validation_rules:
      - target_lane_must_exist_in_lane_set
      - connection_must_be_geometrically_plausible
      - connection_must_not_reference_the_wrong_intersection

  MapData.intersections[].laneSet[].connectsTo[].signalGroup:
    mandatory_in_mvp: true
    population_mode: evidence_fused
    required_fact_types:
      - phase_label
      - stage_phase_relationship
      - movement_phase_mapping
      - lane_connection_candidate
    source_priority:
      - priority: P1
        source_category: site_configuration_information
        preferred_subtypes:
          - controller_configuration_pdf
          - utc_form_docx
          - signal_specification_pdf
        use_for: phase_stage_control_semantics
      - priority: P2
        source_category: site_configuration_information
        preferred_subtypes:
          - mova_schematic_docx
        use_for: movement_to_phase_interpretation_support
      - priority: P3
        source_category: site_plans_and_cad_files
        preferred_subtypes:
