mandatory_mapem_paths:
  - header.protocolVersion
  - header.messageID
  - header.stationID
  - MapData.msgIssueRevision
  - MapData.intersections[].id.region
  - MapData.intersections[].id.id
  - MapData.intersections[].revision
  - MapData.intersections[].refPoint.lat
  - MapData.intersections[].refPoint.long

source_categories:
  system_constant:
    confirmed_in_current_dataset: true
    active_mvp_dependency: true
    provides:
      - protocol_version
      - message_id

  system_allocation:
    confirmed_in_current_dataset: true
    active_mvp_dependency: true
    provides:
      - stable_lane_id
      - generated_internal_identifiers

  derived_from_geometry_processing:
    confirmed_in_current_dataset: true
    active_mvp_dependency: true
    provides:
      - classified_lane_direction
      - approach_assignment
      - node_deltas_relative_to_refpoint

  project_or_client_configuration:
    confirmed_in_current_dataset: required
    active_mvp_dependency: true
    possible_subtypes:
      - client_deployment_configuration
      - mapem_lifecycle_record
      - authority_identifier_mapping
      - topology_change_record
    provides:
      - station_id
      - road_regulator_id
      - mapem_message_revision
      - topology_revision

  site_plans_and_cad_files:
    confirmed_in_current_dataset: true
    active_mvp_dependency: true
    confirmed_subtypes:
      - cad_drawing
      - annotated_drawing_pdf
      - embedded_layout_in_specification_pdf
    provides:
      - vector_geometry
      - title_block_site_identity
      - junction_centre_candidate
      - coordinate_reference_system_evidence
      - lane_candidate
      - lane_centreline_nodes
      - stop_line_candidate
      - road_arm_candidate
      - lane_connection_candidate
      - lane_marking_evidence
      - movement_annotation

  site_configuration_information:
    confirmed_in_current_dataset: true
    active_mvp_dependency: true
    confirmed_subtypes:
      - signal_specification_pdf
      - controller_configuration_pdf
      - utc_form_docx
      - mova_schematic_docx
      - ram_8tx
      - mova_proprietary_file
    provides:
      - official_intersection_id
      - scn
      - orn
      - site_identity_evidence
      - phase_label
      - stage_phase_relationship
      - movement_phase_mapping
      - pedestrian_phase_candidate
      - configuration_notes

  gis_data:
    confirmed_in_current_dataset: false
    active_mvp_dependency: false
    possible_subtypes:
      - ordnance_survey
      - authoritative_gis
      - open_street_map
    provides:
      - geographic_cross_check
      - fallback_reference_point_evidence

  asset_management_tools:
    confirmed_in_current_dataset: false
    active_mvp_dependency: false
    possible_subtypes:
      - pole_asset_export
      - signal_head_asset_export
    provides:
      - equipment_location_evidence

  road_condition_and_lidar_surveys:
    confirmed_in_current_dataset: false
    active_mvp_dependency: false
    possible_subtypes:
      - lidar
      - topographic_survey
    provides:
      - high_resolution_lane_geometry
      - geometry_validation_evidence

  package_metadata:
    confirmed_in_current_dataset: true
    active_mvp_dependency: false
    possible_subtypes:
      - filename
      - package_folder_name
      - cad_manifest_txt
    provides:
      - weak_site_identity_hint
      - external_reference_identification

elements:
  header.protocolVersion:
    mandatory_in_mvp: true
    population_mode: constant
    required_fact_types: []
    source_priority:
      - priority: P1
        source_category: system_constant
        preferred_subtypes:
          - mapem_profile_constant
        condition: required_mapem_profile_selected
    source_conditions:
      - profile_version_must_be_selected_before_generation
    review_triggers:
      - protocol_version_constant_missing
      - protocol_version_constant_conflicts_with_profile
    validation_rules:
      - protocol_version_must_match_required_constant

  header.messageID:
    mandatory_in_mvp: true
    population_mode: constant
    required_fact_types: []
    source_priority:
      - priority: P1
        source_category: system_constant
        preferred_subtypes:
          - mapem_message_type_constant
        condition: message_type_is_mapem
    source_conditions:
      - message_type_must_be_selected_before_generation
    review_triggers:
      - message_id_constant_missing
      - message_id_does_not_identify_mapem
    validation_rules:
      - message_id_must_identify_mapem

  header.stationID:
    mandatory_in_mvp: true
    population_mode: client_configured
    required_fact_types:
      - station_id
    source_priority:
      - priority: P1
        source_category: project_or_client_configuration
        preferred_subtypes:
          - client_deployment_configuration
        condition: station_id_explicitly_configured
      - priority: P2
        source_category: site_configuration_information
        preferred_subtypes:
          - utc_form_docx
          - controller_configuration_pdf
          - signal_specification_pdf
        condition: only_if_station_id_is_explicit
      - priority: P3
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - annotated_drawing_pdf
          - cad_drawing
        condition: title_block_or_metadata_contains_explicit_station_id
    source_conditions:
      - do_not_infer_station_id_from_filename_only
      - official_source_must_explicitly_label_station_id
    review_triggers:
      - missing_station_id
      - conflicting_station_ids
      - station_id_only_available_from_filename
    validation_rules:
      - station_id_must_be_populated
      - station_id_must_be_confirmed_by_explicit_source_or_review

  MapData.msgIssueRevision:
    mandatory_in_mvp: true
    population_mode: project_managed
    required_fact_types:
      - mapem_message_revision
    source_priority:
      - priority: P1
        source_category: project_or_client_configuration
        preferred_subtypes:
          - mapem_lifecycle_record
        condition: lifecycle_record_available
    source_conditions:
      - revision_is_managed_by_mapem_lifecycle_not_copied_from_document_issue
    review_triggers:
      - msg_issue_revision_not_initialised
      - document_issue_number_used_as_msg_issue_revision
    validation_rules:
      - msg_issue_revision_must_be_present
      - msg_issue_revision_must_not_be_copied_from_ordinary_document_issue

  MapData.intersections[].id.region:
    mandatory_in_mvp: true
    population_mode: client_configured
    required_fact_types:
      - road_regulator_id
    source_priority:
      - priority: P1
        source_category: project_or_client_configuration
        preferred_subtypes:
          - authority_identifier_mapping
          - client_deployment_configuration
        condition: road_regulator_id_explicitly_configured
      - priority: P2
        source_category: site_configuration_information
        preferred_subtypes:
          - utc_form_docx
          - signal_specification_pdf
          - controller_configuration_pdf
        condition: only_if_road_regulator_id_is_explicit
      - priority: P3
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - annotated_drawing_pdf
          - cad_drawing
        condition: title_block_contains_explicit_road_regulator_identifier
    source_conditions:
      - region_must_represent_the_road_regulator_identifier
      - local_authority_name_alone_requires_identifier_mapping
    review_triggers:
      - missing_road_regulator_id
      - authority_identifier_unconfirmed
      - conflicting_road_regulator_ids
    validation_rules:
      - region_must_be_populated
      - region_must_be_valid_for_deployment_domain

  MapData.intersections[].id.id:
    mandatory_in_mvp: true
    population_mode: directly_extracted
    required_fact_types:
      - official_intersection_id
      - scn
      - orn
    source_priority:
      - priority: P1
        source_category: site_configuration_information
        preferred_subtypes:
          - utc_form_docx
          - controller_configuration_pdf
          - signal_specification_pdf
        use_for: official_site_identity
      - priority: P2
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - annotated_drawing_pdf
          - cad_drawing
        use_for: title_block_confirmation
      - priority: P3
        source_category: package_metadata
        preferred_subtypes:
          - filename
          - package_folder_name
        condition: fallback_only_with_review
    source_conditions:
      - prefer_explicit_official_identifier_over_inferred_filename_identifier
      - drawing_title_block_can_confirm_but_should_not_override_official_configuration
    review_triggers:
      - missing_official_intersection_id
      - conflicting_official_intersection_ids
      - only_filename_identifier_available
    validation_rules:
      - intersection_id_must_be_present
      - intersection_id_must_identify_one_intersection
      - intersection_id_must_be_unique_within_road_regulator_domain

  MapData.intersections[].revision:
    mandatory_in_mvp: true
    population_mode: project_managed
    required_fact_types:
      - topology_revision
    source_priority:
      - priority: P1
        source_category: project_or_client_configuration
        preferred_subtypes:
          - mapem_lifecycle_record
          - topology_change_record
        condition: topology_revision_managed_by_project
      - priority: P2
        source_category: project_or_client_configuration
        preferred_subtypes:
          - client_deployment_configuration
        condition: explicit_client_confirmation_available
    source_conditions:
      - revision_changes_only_when_map_topology_changes
      - ordinary_document_issue_numbers_are_not_topology_revisions
    review_triggers:
      - topology_revision_not_initialised
      - document_issue_mistaken_as_topology_revision
      - topology_change_without_revision_update
    validation_rules:
      - topology_revision_must_be_present
      - topology_revision_must_match_mapem_lifecycle_record
      - topology_revision_must_align_with_spatem_revision_when_paired

  MapData.intersections[].refPoint.lat:
    mandatory_in_mvp: true
    population_mode: geometry_derived
    required_fact_types:
      - junction_centre_candidate
      - coordinate_reference_system_evidence
      - georeference_status
      - reference_point_latitude
    source_priority:
      - priority: P1
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - cad_drawing
        condition: cad_is_georeferenced_or_crs_is_reliably_known
      - priority: P2
        source_category: gis_data
        preferred_subtypes:
          - ordnance_survey
          - authoritative_gis
        condition: if_available
      - priority: P3
        source_category: gis_data
        preferred_subtypes:
          - open_street_map
        condition: approximate_fallback_or_cross_check
    source_conditions:
      - coordinate_reference_system_must_be_known
      - reference_point_should_represent_junction_conflict_area_centre
      - pdf_or_image_layout_alone_cannot_produce_reliable_latitude_without_alignment
    review_triggers:
      - cad_coordinate_system_unknown
      - candidate_reference_points_conflict
      - reference_point_outside_expected_junction_area
      - only_review_alignment_available
    validation_rules:
      - latitude_must_be_present
      - latitude_must_be_in_valid_range
      - reference_point_should_be_near_conflict_area_centre

  MapData.intersections[].refPoint.long:
    mandatory_in_mvp: true
    population_mode: geometry_derived
    required_fact_types:
      - junction_centre_candidate
      - coordinate_reference_system_evidence
      - georeference_status
      - reference_point_longitude
    source_priority:
      - priority: P1
        source_category: site_plans_and_cad_files
        preferred_subtypes:
          - cad_drawing
        condition: cad_is_georeferenced_or_crs_is_reliably_known
      - priority: P2
        source_category: gis_data
        preferred_subtypes:
          - ordnance_survey
          - authoritative_gis
        condition: if_available
      - priority: P3
        source_category: gis_data
        preferred_subtypes:
          - open_street_map
        condition: approximate_fallback_or_cross_check
    source_conditions:
      - coordinate_reference_system_must_be_known
      - reference_point_should_represent_junction_conflict_area_centre
      - pdf_or_image_layout_alone_cannot_produce_reliable_longitude_without_alignment
    review_triggers:
      - cad_coordinate_system_unknown
      - candidate_reference_points_conflict
      - reference_point_outside_expected_junction_area
      - only_review_alignment_available
    validation_rules:
      - longitude_must_be_present
      - longitude_must_be_in_valid_range
      - reference_point_should_be_near_conflict_area_centre
