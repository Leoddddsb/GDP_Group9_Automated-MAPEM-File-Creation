dictionary:
  name: mapem_element_source_priority_dictionary
  version: "1.0.0"
  scope:
    description: "Integrated mandatory MVP MAPEM element-source priority dictionary."
    element_centric: true
    site_specific_values_included: false
    extracted_evidence_table: false
    path_convention: "Use map.intersections[].laneSet[] consistently for MAPEM paths."
    expected_process_file: "MAPEM_Element_Source_Priority_Dictionary_Making_Process (4).md"
    process_file_available_during_integration: false
    process_rule_fallback: "The nine-field process stated in the integration prompt was used because the expected process file was not present."
  elements:
    "header.protocolVersion":
      mandatory_in_mvp: true
      population_mode: constant
      required_fact_types: []
      source_priority:
        - priority: P1
          source_category: system_configuration
          source_subtype: mapem_profile_constant
          use_for: "Populate the required protocol version constant."
      source_conditions:
        - "Use the constant required by the selected MAPEM profile."
      manual_review_triggers:
        - protocol_version_constant_missing
        - protocol_version_constant_conflicts_with_profile
      validation_rules:
        - protocol_version_must_match_required_profile_constant
      notes:
        - "Do not infer this value from site files."

    "header.messageID":
      mandatory_in_mvp: true
      population_mode: constant
      required_fact_types: []
      source_priority:
        - priority: P1
          source_category: system_configuration
          source_subtype: mapem_message_id_constant
          use_for: "Populate the message identifier constant for MAPEM."
      source_conditions:
        - "Use the constant that identifies a MAPEM message."
      manual_review_triggers:
        - message_id_constant_missing
        - message_id_does_not_identify_mapem
      validation_rules:
        - message_id_must_identify_mapem
      notes:
        - "Do not infer this value from site files."

    "header.stationID":
      mandatory_in_mvp: true
      population_mode: client_configured
      required_fact_types:
        - station_id
      source_priority:
        - priority: P1
          source_category: project_or_client_configuration
          source_subtype: explicit_station_id_configuration
          use_for: "Use an explicitly supplied deployment station ID."
        - priority: P2
          source_category: site_configuration_information
          source_subtype: explicit_station_id_in_configuration_document
          use_for: "Use only when a site document explicitly identifies the station ID."
        - priority: P3
          source_category: project_or_client_configuration
          source_subtype: manual_station_id_confirmation
          use_for: "Ask the client to provide or confirm the station ID."
      source_conditions:
        - "Do not accept a filename, drawing number, SCN, or inferred site code as stationID without explicit confirmation."
      manual_review_triggers:
        - missing_station_id
        - conflicting_station_ids
        - station_id_only_available_from_filename
        - station_id_not_available_from_remaining_source_categories
      validation_rules:
        - station_id_must_be_populated
        - station_id_must_be_explicitly_sourced_or_manually_confirmed
      notes:
        - "stationID is a configured deployment identifier, not a geometry-derived field."

    "map.msgIssueRevision":
      mandatory_in_mvp: true
      population_mode: project_managed
      required_fact_types:
        - mapem_message_revision
      source_priority:
        - priority: P1
          source_category: project_or_client_configuration
          source_subtype: mapem_lifecycle_record
          use_for: "Maintain the MAPEM message revision through the project lifecycle."
        - priority: P3
          source_category: project_or_client_configuration
          source_subtype: manual_revision_initialisation
          use_for: "Initialise or correct the lifecycle revision manually when required."
      source_conditions:
        - "Do not copy an ordinary document issue number into msgIssueRevision."
      manual_review_triggers:
        - msg_issue_revision_not_initialised
        - document_issue_number_used_as_msg_issue_revision
      validation_rules:
        - msg_issue_revision_must_be_initialised
        - msg_issue_revision_must_be_managed_by_mapem_lifecycle
      notes:
        - "This is an internal lifecycle value."

    "map.intersections[].id.region":
      mandatory_in_mvp: true
      population_mode: client_configured
      required_fact_types:
        - road_regulator_id
      source_priority:
        - priority: P1
          source_category: project_or_client_configuration
          source_subtype: road_regulator_assignment
          use_for: "Use the official road-regulator ID for the deployment domain."
        - priority: P2
          source_category: site_configuration_information
          source_subtype: explicit_authority_identifier
          use_for: "Use an official site configuration document only when the authority identifier is explicit."
        - priority: P3
          source_category: project_or_client_configuration
          source_subtype: manual_road_regulator_confirmation
          use_for: "Ask the client to confirm the road-regulator ID."
      source_conditions:
        - "Do not infer region from a local site code or filename."
      manual_review_triggers:
        - missing_road_regulator_id
        - authority_identifier_unconfirmed
        - conflicting_road_regulator_ids
        - road_regulator_id_not_available_from_remaining_source_categories
      validation_rules:
        - region_must_be_populated
        - region_must_be_valid_for_deployment_domain
      notes:
        - "The region identifies the road-regulator domain."

    "map.intersections[].id.id":
      mandatory_in_mvp: true
      population_mode: directly_extracted
      required_fact_types:
        - official_intersection_id
        - scn
        - orn
      source_priority:
        - priority: P1
          source_category: site_configuration_information
          source_subtype:
            - utc_form_docx
            - controller_configuration_pdf
            - signal_specification_pdf
          use_for: "Extract the official intersection identifier from site configuration documents."
        - priority: P2
          source_category: site_plans_and_cad_files
          source_subtype: drawing_title_block
          use_for: "Confirm an identifier shown explicitly in the drawing title block."
        - priority: P3
          source_category: site_plans_and_cad_files
          source_subtype: filename_or_package_metadata
          use_for: "Use filename or package metadata only with manual confirmation."
      source_conditions:
        - "Prefer an official explicit site identifier such as SCN or ORN."
        - "Retain provenance when multiple identifiers are available."
      manual_review_triggers:
        - missing_official_intersection_id
        - conflicting_official_intersection_ids
        - only_filename_identifier_available
      validation_rules:
        - intersection_id_must_identify_one_intersection
        - intersection_id_must_be_unique_within_road_regulator_domain
      notes:
        - "The selected identifier must be explicit and deployment-appropriate."

    "map.intersections[].revision":
      mandatory_in_mvp: true
      population_mode: project_managed
      required_fact_types:
        - topology_revision
      source_priority:
        - priority: P1
          source_category: project_or_client_configuration
          source_subtype: topology_lifecycle_record
          use_for: "Maintain the topology revision when MAPEM geometry or topology changes."
        - priority: P3
          source_category: project_or_client_configuration
          source_subtype: manual_topology_revision_confirmation
          use_for: "Initialise or correct the topology revision manually."
      source_conditions:
        - "Do not copy an ordinary drawing or document issue number automatically."
        - "Update the value only when topology changes."
      manual_review_triggers:
        - topology_revision_not_initialised
        - document_issue_mistaken_as_topology_revision
        - topology_change_without_revision_update
      validation_rules:
        - topology_revision_must_be_initialised
        - topology_revision_must_update_for_topology_change
        - topology_revision_should_align_with_spatem_revision_when_paired
      notes:
        - "This is an internal topology lifecycle value."

    "map.intersections[].refPoint.lat":
      mandatory_in_mvp: true
      population_mode: geometry_derived
      required_fact_types:
        - junction_centre_candidate
        - coordinate_reference_system_evidence
        - georeference_status
        - reference_point_latitude
      source_priority:
        - priority: P1
          source_category: site_plans_and_cad_files
          source_subtype: cad_drawing
          use_for: "Derive latitude from CAD when georeferenced or when its CRS is reliably known."
        - priority: P2
          source_category: gis_data
          source_subtype: ordnance_survey_or_authoritative_gis
          use_for: "Derive or corroborate latitude using supplied authoritative GIS."
        - priority: P3
          source_category: gis_data
          source_subtype: open_street_map
          use_for: "Provide an approximate fallback or alignment check."
        - priority: P3
          source_category: site_plans_and_cad_files
          source_subtype: manually_aligned_annotated_drawing_pdf
          use_for: "Use a drawing PDF only after manual alignment to trusted control points."
      source_conditions:
        - "The selected point must lie roughly within the intersection conflict area."
        - "Convert the accepted candidate to WGS84 latitude and retain CRS provenance."
        - "Review latitude and longitude as one refPoint pair."
      manual_review_triggers:
        - cad_coordinate_system_unknown
        - candidate_reference_points_conflict
        - reference_point_outside_expected_junction_area
        - only_manual_alignment_available
      validation_rules:
        - latitude_must_be_populated
        - latitude_must_be_valid_wgs84_value
        - reference_point_must_be_near_conflict_area_centre
      notes:
        - "refPoint anchors the relative MAPEM geometry."

    "map.intersections[].refPoint.long":
      mandatory_in_mvp: true
      population_mode: geometry_derived
      required_fact_types:
        - junction_centre_candidate
        - coordinate_reference_system_evidence
        - georeference_status
        - reference_point_longitude
      source_priority:
        - priority: P1
          source_category: site_plans_and_cad_files
          source_subtype: cad_drawing
          use_for: "Derive longitude from CAD when georeferenced or when its CRS is reliably known."
        - priority: P2
          source_category: gis_data
          source_subtype: ordnance_survey_or_authoritative_gis
          use_for: "Derive or corroborate longitude using supplied authoritative GIS."
        - priority: P3
          source_category: gis_data
          source_subtype: open_street_map
          use_for: "Provide an approximate fallback or alignment check."
        - priority: P3
          source_category: site_plans_and_cad_files
          source_subtype: manually_aligned_annotated_drawing_pdf
          use_for: "Use a drawing PDF only after manual alignment to trusted control points."
      source_conditions:
        - "The selected point must lie roughly within the intersection conflict area."
        - "Convert the accepted candidate to WGS84 longitude and retain CRS provenance."
        - "Review latitude and longitude as one refPoint pair."
      manual_review_triggers:
        - cad_coordinate_system_unknown
        - candidate_reference_points_conflict
        - reference_point_outside_expected_junction_area
        - only_manual_alignment_available
      validation_rules:
        - longitude_must_be_populated
        - longitude_must_be_valid_wgs84_value
        - reference_point_must_be_near_conflict_area_centre
      notes:
        - "refPoint anchors the relative MAPEM geometry."

    "map.intersections[].laneSet[]":
      mandatory_in_mvp: true
      population_mode: geometry_derived
      required_fact_types:
        - controlled_lane_candidate
        - crosswalk_lane_candidate
        - lane_candidate
        - signal_controlled_lane_evidence
      source_priority:
        - priority: P1
          source_category: site_plans_and_cad_files
          source_subtype: cad_drawing
          use_for: "Extract individual lane, crossing, and stop-line geometry candidates."
        - priority: P2
          source_category: site_plans_and_cad_files
          source_subtype:
            - annotated_drawing_pdf
            - embedded_layout_in_specification_pdf
          use_for: "Extract or corroborate candidates when CAD is unavailable or ambiguous."
        - priority: P3
          source_category: project_or_client_configuration
          source_subtype: manual_geometry_review
          use_for: "Manually delineate unresolved controlled lanes and crossings."
      source_conditions:
        - "Describe relevant lanes individually."
        - "Use site configuration information to confirm which candidates are signal-controlled."
      manual_review_triggers:
        - controlled_lanes_or_crossings_unresolved
        - lane_geometry_sources_disagree
        - roundabout_internal_lanes_ambiguous
      validation_rules:
        - lane_set_must_be_populated
        - all_fused_signal_controlled_lanes_must_be_included
        - relevant_physical_lanes_must_be_represented_individually
      notes:
        - "Geometry delineates candidates; configuration evidence confirms controlled scope."

    "map.intersections[].laneSet[].laneID":
      mandatory_in_mvp: true
      population_mode: system_generated
      required_fact_types:
        - lane_candidate
        - stable_lane_ordering_rule
      source_priority:
        - priority: P1
          source_category: project_or_client_configuration
          source_subtype: stable_lane_ordering_rule
          use_for: "Generate deterministic lane IDs after lane extraction."
        - priority: P2
          source_category: site_plans_and_cad_files
          source_subtype: cad_drawing
          use_for: "Provide stable geometry for ordering, not final MAPEM lane IDs."
        - priority: P3
          source_category: project_or_client_configuration
          source_subtype: manual_ordering_confirmation
          use_for: "Resolve ordering ties or unstable lane candidates."
      source_conditions:
        - "Generate IDs only after the final lane candidate set is available."
        - "Do not treat CAD labels as authoritative MAPEM lane IDs."
      manual_review_triggers:
        - lane_ordering_tie
        - unresolved_lane_geometry
        - lane_candidate_set_changed_after_id_generation
      validation_rules:
        - every_lane_must_have_lane_id
        - lane_ids_must_be_unique_within_intersection
        - lane_id_generation_must_be_deterministic
      notes:
        - "Generated values must not encode meaning that cannot be guaranteed."

    "map.intersections[].laneSet[].ingressApproach":
      mandatory_in_mvp: true
      population_mode: geometry_derived
      required_fact_types:
        - lane_direction_candidate
        - stop_line_candidate
        - road_arm_candidate
        - approach_group_candidate
      source_priority:
        - priority: P1
          source_category: site_plans_and_cad_files
          source_subtype: cad_drawing
          use_for: "Group inbound lanes by road arm and travel direction."
        - priority: P2
          source_category: site_plans_and_cad_files
          source_subtype:
            - annotated_drawing_pdf
            - embedded_layout_in_specification_pdf
          use_for: "Corroborate inbound direction and arm grouping."
        - priority: P3
          source_category: project_or_client_configuration
          source_subtype: manual_approach_assignment
          use_for: "Assign unresolved ingress approaches manually."
      source_conditions:
        - "Resolve inbound direction, road arm, and stop-line context before assignment."
      manual_review_triggers:
        - inbound_direction_uncertain
        - stop_line_conflicts_with_inbound_direction
        - ingress_road_arm_grouping_ambiguous
      validation_rules:
        - ingress_lane_must_have_ingress_approach
        - ingress_approach_grouping_must_be_consistent
        - ingress_approach_must_match_directional_use
      notes:
        - "Configuration documents and MOVA schematics may support interpretation when they map clearly to the lane."

    "map.intersections[].laneSet[].egressApproach":
      mandatory_in_mvp: true
      population_mode: geometry_derived
      required_fact_types:
        - lane_direction_candidate
        - stop_line_candidate
        - road_arm_candidate
        - approach_group_candidate
      source_priority:
        - priority: P1
          source_category: site_plans_and_cad_files
          source_subtype: cad_drawing
          use_for: "Group outbound lanes by road arm and travel direction."
        - priority: P2
          source_category: site_plans_and_cad_files
          source_subtype:
            - annotated_drawing_pdf
            - embedded_layout_in_specification_pdf
          use_for: "Corroborate outbound direction and arm grouping."
        - priority: P3
          source_category: project_or_client_configuration
          source_subtype: manual_approach_assignment
          use_for: "Assign unresolved egress approaches manually."
      source_conditions:
        - "Resolve outbound direction, road arm, and conflict-area exit before assignment."
      manual_review_triggers:
        - outbound_direction_uncertain
        - exit_geometry_conflicts_with_outbound_direction
        - egress_road_arm_grouping_ambiguous
      validation_rules:
        - egress_lane_must_have_egress_approach
        - egress_approach_grouping_must_be_consistent
        - egress_approach_must_match_directional_use
      notes:
        - "Configuration documents and MOVA schematics may support interpretation when they map clearly to the lane."

    "map.intersections[].laneSet[].laneAttributes.directionalUse":
      mandatory_in_mvp: true
      population_mode: geometry_derived
      required_fact_types:
        - classified_lane_direction
        - approach_assignment
        - stop_line_candidate
      source_priority:
        - priority: P1
          source_category: site_plans_and_cad_files
          source_subtype: cad_drawing
          use_for: "Set ingressPath and egressPath from resolved lane direction and approach assignment."
        - priority: P2
          source_category: site_plans_and_cad_files
          source_subtype: annotated_drawing_pdf
          use_for: "Validate the inferred lane direction using drawing arrows and stop-line context."
        - priority: P3
          source_category: project_or_client_configuration
          source_subtype: manual_direction_confirmation
          use_for: "Confirm unresolved directional-use bits manually."
      source_conditions:
        - "Derive directionalUse after approach assignment."
      manual_review_triggers:
        - approach_assignment_unresolved
        - geometry_stop_line_and_schematic_direction_conflict
      validation_rules:
        - directional_use_must_be_populated
        - ingress_lanes_must_assert_ingress_path
        - egress_lanes_must_assert_egress_path
        - reviewed_bidirectional_lanes_must_assert_both_bits
      notes:
        - "Use ingressPath for ingress lanes and egressPath for egress lanes."

    "map.intersections[].laneSet[].laneAttributes.sharedWith":
      mandatory_in_mvp: true
      population_mode: evidence_fused
      required_fact_types:
        - shared_use_candidate
        - bus_lane_candidate
        - cycle_lane_candidate
        - pedestrian_shared_use_candidate
        - road_marking_or_sign_note
      source_priority:
        - priority: P1
          source_category: site_plans_and_cad_files
          source_subtype:
            - cad_drawing
            - annotated_drawing_pdf
          use_for: "Identify markings, signs, or geometry showing explicit shared use."
        - priority: P2
          source_category: site_configuration_information
          source_subtype:
            - signal_specification_pdf
            - controller_configuration_pdf
            - mova_schematic_docx
            - utc_form_docx
          use_for: "Corroborate lane-specific shared-use evidence."
        - priority: P3
          source_category: project_or_client_configuration
          source_subtype: manual_shared_use_confirmation
          use_for: "Confirm the mandatory bit string manually."
      source_conditions:
        - "Populate the mandatory bit string even when no special sharing bit is asserted."
        - "Assert sharing bits only when lane-specific evidence supports them."
      manual_review_triggers:
        - shared_use_unclear
        - shared_use_sources_conflict
        - primary_lane_user_unclear
      validation_rules:
        - shared_with_must_be_populated
        - asserted_shared_with_bits_must_have_provenance
        - disallowed_shared_with_bits_must_not_be_asserted
      notes:
        - "Coordinate sharedWith with the selected primary laneType."

    "map.intersections[].laneSet[].laneAttributes.laneType":
      mandatory_in_mvp: true
      population_mode: evidence_fused
      required_fact_types:
        - lane_type_candidate
        - vehicle_lane_candidate
        - crossing_candidate
        - pedestrian_phase_candidate
        - cycle_lane_candidate
        - bus_lane_candidate
      source_priority:
        - priority: P1
          source_category: site_plans_and_cad_files
          source_subtype:
            - cad_drawing
            - annotated_drawing_pdf
          use_for: "Classify the lane from geometry, markings, and annotations."
        - priority: P2
          source_category: site_configuration_information
          source_subtype:
            - signal_specification_pdf
            - controller_configuration_pdf
            - mova_schematic_docx
            - utc_form_docx
          use_for: "Corroborate vehicle, pedestrian, cycle, bus, and crossing classifications."
        - priority: P3
          source_category: project_or_client_configuration
          source_subtype: manual_lane_type_classification
          use_for: "Select the lane type manually where evidence remains unclear."
      source_conditions:
        - "Select the primary lane characteristic or right-of-way user."
        - "Coordinate laneType with sharedWith."
      manual_review_triggers:
        - lane_type_geometry_and_control_evidence_disagree
        - special_lane_facility_unclear
        - lane_type_evidence_missing
      validation_rules:
        - lane_type_must_be_populated
        - lane_type_must_be_supported_choice
        - lane_type_and_shared_with_must_be_consistent
      notes:
        - "Bus-priority configuration is supporting evidence, not automatic proof of a dedicated bus lane."

    "map.intersections[].laneSet[].nodeList.nodes[].delta":
      mandatory_in_mvp: true
      population_mode: geometry_derived
      required_fact_types:
        - lane_geometry_candidate
        - lane_centreline_nodes
        - upstream_refPoint
        - coordinate_reference_system_evidence
        - georeference_status
        - node_position_offsets
      source_priority:
        - priority: P1
          source_category: site_plans_and_cad_files
          source_subtype: cad_drawing
          use_for: "Extract or infer lane centreline geometry."
        - priority: P2
          source_category: road_condition_and_lidar_surveys
          source_subtype:
            - lidar
            - topographic_survey
          use_for: "Validate high-resolution geometry when supplied."
        - priority: P3
          source_category: site_plans_and_cad_files
          source_subtype: annotated_drawing_pdf
          use_for: "Digitise lane geometry manually when higher-priority geometry is unavailable."
      source_conditions:
        - "Calculate the first node relative to refPoint and subsequent nodes relative to the previous node."
        - "Use GIS only for approximate alignment or validation support."
      manual_review_triggers:
        - cad_coordinate_system_unknown
        - lane_centreline_broken
        - lane_geometry_ambiguous
        - refpoint_missing_or_uncertain
        - pdf_digitisation_required
        - node_offset_out_of_range
      validation_rules:
        - nodes_must_follow_lane_centreline
        - nodes_must_be_relative_to_refpoint
        - lane_geometry_must_not_cross_unintended_conflict_area
        - node_offsets_must_be_valid_node_xy_values
        - geometry_should_be_consistent_with_lane_direction
        - node_count_should_be_minimised_within_quality_limits
      notes:
        - "delta describes x/y position offsets; lane-width variation is outside this element."

    "map.intersections[].laneSet[].connectsTo[].connectingLane.lane":
      mandatory_in_mvp: true
      population_mode: evidence_fused
      required_fact_types:
        - lane_candidate
        - lane_id_assignment
        - lane_connection_candidate
        - target_lane_candidate
        - movement_direction_candidate
        - lane_direction_candidate
        - stop_line_candidate
      source_priority:
        - priority: P1
          source_category: site_plans_and_cad_files
          source_subtype: cad_drawing
          use_for: "Infer physical lane topology and downstream connections."
        - priority: P2
          source_category: site_plans_and_cad_files
          source_subtype: annotated_drawing_pdf
          use_for: "Support interpretation using movement arrows, layout, and road markings."
        - priority: P3
          source_category: site_configuration_information
          source_subtype:
            - mova_schematic_docx
            - signal_specification_pdf
          use_for: "Support movement interpretation where geometry is unclear."
      source_conditions:
        - "Assign laneID values before resolving target lane references."
        - "Use GIS only for approximate topology support."
      manual_review_triggers:
        - multiple_target_lanes_plausible
        - target_lane_missing
        - complex_internal_connection_uncertain
        - lane_direction_uncertain
        - movement_arrow_conflicts_with_geometry
        - connection_crosses_invalid_area
      validation_rules:
        - target_lane_id_must_exist
        - ingress_lane_should_connect_to_valid_downstream_lane
        - connection_should_follow_lane_direction
        - connection_should_be_consistent_with_topology
        - complex_connections_should_preserve_circulatory_logic
      notes:
        - "The value is the target laneID, not a road name or phase label."

    "map.intersections[].laneSet[].connectsTo[].signalGroup":
      mandatory_in_mvp: true
      population_mode: evidence_fused
      required_fact_types:
        - phase_label
        - phase_type
        - stage_phase_relationship
        - movement_phase_mapping
        - lane_connection_candidate
        - target_lane_candidate
        - signal_group_assignment_candidate
        - control_stream_candidate
        - conflict_matrix_evidence
      source_priority:
        - priority: P1
          evidence_group: signal_control
          source_category: site_configuration_information
          source_subtype: signal_control_configuration_document
          use_for: "Resolve formal phase, stage, stream, movement, and control logic."
        - priority: P1
          evidence_group: physical_connection
          source_category: site_plans_and_cad_files
          source_subtype: cad_drawing
          use_for: "Resolve the physical lane connection receiving the signal group."
        - priority: P2
          evidence_group: signal_control
          source_category: site_configuration_information
          source_subtype: utc_form_docx
          use_for: "Corroborate staging, phasing, and SCOOT movement support."
        - priority: P2
          evidence_group: physical_connection
